  box-shadow:0 50px 90px -46px #000}
body[data-theme="noir"] .head{grid-template-columns:1fr;gap:12px}
body[data-theme="noir"] .head h2{font-size:clamp(30px,4.6vw,54px)}
body[data-theme="noir"] .head .num{color:var(--accent)}
body[data-theme="noir"] .bio .item:first-child p{font-size:21px;line-height:1.62}
body[data-theme="noir"] .tl-item:hover{background:linear-gradient(90deg,
  color-mix(in srgb,var(--accent) 8%,transparent),transparent 62%)}
body[data-theme="noir"] .gal{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:2px 28px 22px;margin-inline:-28px;scrollbar-width:thin}
body[data-theme="noir"] .gal::-webkit-scrollbar{height:5px}
body[data-theme="noir"] .gal::-webkit-scrollbar-thumb{background:var(--hair)}
body[data-theme="noir"] .shot{flex:0 0 min(80vw,392px);scroll-snap-align:center}
body[data-theme="noir"] .shot .frame,
body[data-theme="noir"] .shot:nth-child(3n+1) .frame,
body[data-theme="noir"] .shot:nth-child(3n) .frame{aspect-ratio:4/5}
body[data-theme="noir"] .shot .frame img{filter:grayscale(.45)}
body[data-theme="noir"] .shot .frame:hover img{filter:none}
body[data-theme="noir"] .shot .n{display:block}
body[data-theme="noir"] .arrows{display:flex}
body[data-theme="noir"] .videos{grid-template-columns:1fr;gap:56px}
body[data-theme="noir"] .vcard{display:grid;grid-template-columns:1.55fr 1fr;
  gap:40px;align-items:center}
body[data-theme="noir"] .vcard:nth-child(even){grid-template-columns:1fr 1.55fr}
body[data-theme="noir"] .vcard:nth-child(even) .vmeta{order:-1}
body[data-theme="noir"] .vbox{box-shadow:0 50px 90px -50px #000}
body[data-theme="noir"] .vmeta h3{font-size:27px}
@media(max-width:860px){
  body[data-theme="noir"] .vcard,
  body[data-theme="noir"] .vcard:nth-child(even){grid-template-columns:1fr;gap:16px}
  body[data-theme="noir"] .vcard:nth-child(even) .vmeta{order:0}
}
body[data-theme="noir"] .mem{display:flex;gap:26px;overflow-x:auto;
  scroll-snap-type:x mandatory;padding:0 28px 20px;margin-inline:-28px;scrollbar-width:thin}
body[data-theme="noir"] .memo{flex:0 0 min(88vw,540px);scroll-snap-align:center;
  border-left:1px solid var(--accent);padding-left:28px}
body[data-theme="noir"] .memo p{font-size:clamp(19px,2.2vw,25px);font-style:italic}
/* @end */

/* ================================================================ */
/* ТЕМА «БУМАГА»                                                    */
/* ================================================================ */

/* стрелки ленты — только там, где лента */
.arrows{display:none;gap:9px;margin-top:16px}
.arrows button{width:42px;height:42px;border:1px solid var(--line);background:none;
  cursor:pointer;font-size:17px;transition:.2s}
.arrows button:hover{border-color:var(--accent);color:var(--accent)}

/* ================================================================ */
/* РЕДАКТОР                                                         */
/* ================================================================ */
.editbar{position:fixed;right:18px;bottom:18px;z-index:70;display:flex;align-items:center;
  gap:8px;padding:7px;background:var(--panel);border:1px solid var(--line);
  border-radius:100px;box-shadow:0 18px 40px -22px rgba(0,0,0,.55);max-width:calc(100vw - 36px)}
.editbar button{border:0;background:none;cursor:pointer;padding:9px 16px;border-radius:100px;
  font-family:var(--micro);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  white-space:nowrap;transition:.2s}
.editbar button:hover{background:var(--tint)}
.editbar .primary{background:var(--ink);color:var(--bg)}
.editbar .primary:hover{opacity:.85;background:var(--ink)}
.editbar .grp{display:none;align-items:center;gap:4px}
body.editing .editbar .grp{display:flex}
.editbar .st{font-family:var(--micro);font-size:11px;color:var(--soft);
  padding-right:10px;white-space:nowrap}
@media(max-width:700px){
  .editbar{left:12px;right:12px;bottom:12px;justify-content:center;flex-wrap:wrap;border-radius:14px}
  .editbar .st{width:100%;text-align:center;padding:0 0 4px}
}

body.editing [data-bind]{outline:1px dashed var(--hair);outline-offset:3px;
  border-radius:2px;min-width:1.5em;min-height:1em;cursor:text;transition:outline-color .2s}
body.editing [data-bind]:hover{outline-color:var(--accent)}
body.editing [data-bind]:focus{outline:2px solid var(--accent);outline-offset:3px}
body.editing [data-bind]:empty::before{content:attr(data-ph);color:var(--soft);opacity:.65}

.tools{display:none;gap:4px;position:absolute;z-index:4;top:8px;right:8px}
body.editing .item{position:relative}
body.editing .item>.tools{display:flex}
.tools button{width:30px;height:30px;padding:0;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;font-size:13px;line-height:1;
  border-radius:4px;opacity:.55;transition:.18s}
.tools button:hover{opacity:1;border-color:var(--accent);color:var(--accent)}
.tools button[data-act="pic"]{width:auto;padding:0 9px;font-family:var(--micro);
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}

.editonly{display:none}
body.editing .editonly{display:block}
body.editing .hideonedit{display:none}
.add{display:none;width:100%;margin-top:16px;padding:14px;cursor:pointer;
  border:1px dashed var(--hair);background:none;border-radius:var(--radius);
  font-family:var(--micro);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--soft);transition:.2s}
body.editing .add{display:block}
.add:hover{border-color:var(--accent);color:var(--accent)}
.srcrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;
  font-family:var(--micro);font-size:11px;letter-spacing:.06em;color:var(--soft)}
.srcrow [data-bind]{font-family:var(--micro);font-size:11.5px;letter-spacing:0;
  color:var(--ink);background:var(--tint);padding:4px 8px;border-radius:3px;
  word-break:break-all;max-width:100%}
.srcrow button{border:1px solid var(--line);background:var(--panel);cursor:pointer;
  padding:5px 11px;border-radius:3px;font-family:var(--micro);font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase}
.srcrow button:hover{border-color:var(--accent);color:var(--accent)}
.drop{outline:2px solid var(--accent) !important;outline-offset:4px}
</style>
</head>

    <button id="edSave">Сохранить файл</button>
    <button id="edReset">Сбросить</button>
  </span>
</div>

<script>
/* ================================================================ */
/*  ДВИЖОК И РЕДАКТОР. Править не нужно.                            */
/* ================================================================ */

/* слепок исходного файла — из него собирается сохраняемый index.html */
const TEMPLATE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

/* тема по умолчанию: "warm" | "noir" | "paper" */
const DEFAULT_THEME = "noir";

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');

const getPath = (o,p) => p.split('.').reduce((a,k)=>a==null?a:a[k], o);
function setPath(o,p,v){ const k=p.split('.'), last=k.pop(); let t=o; for(const x of k) t=t[x]; t[last]=v; }

/* ---------- заглушка вместо отсутствующего фото ---------- */
function ph(label,w,h){
  const cs=getComputedStyle(document.body);
  const a=cs.getPropertyValue('--ph-a').trim()||'#ddd';
  const b=cs.getPropertyValue('--ph-b').trim()||'#bbb';
  const ink=cs.getPropertyValue('--ph-ink').trim()||'#888';
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'+
    '<stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient></defs>'+
    '<rect width="100%" height="100%" fill="url(#g)"/>'+
    '<rect x="14" y="14" width="'+(w-28)+'" height="'+(h-28)+'" fill="none" stroke="'+ink+'" stroke-opacity=".35"/>'+
    '<text x="50%" y="50%" font-family="Georgia, serif" font-size="'+Math.round(Math.min(w,h)/9)+
    '" fill="'+ink+'" text-anchor="middle" dominant-baseline="middle">'+esc(label)+'</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
const pic = (src,label,w,h) => src ? src : ph(label,w,h);

/* ---------- черновик ---------- */
const KEY = 'pamyat:' + location.pathname;
let draftLoaded = false;
try{
  const raw = localStorage.getItem(KEY);
  if (raw){ Object.assign(DATA, JSON.parse(raw)); draftLoaded = true; }
}catch(e){}
const saveDraft = () => { try{ localStorage.setItem(KEY, JSON.stringify(DATA)); }catch(e){}
  status(draftLoaded ? 'Черновик сохранён' : 'Черновик сохранён'); draftLoaded = true; };
function status(t){ $('#edStatus').textContent = t || ''; }

/* ---------- вспомогательное для списков ---------- */
function tools(list,i,extra){
  const b=(act,ch,t)=>'<button data-act="'+act+'" data-list="'+list+'" data-i="'+i+'" title="'+t+'">'+ch+'</button>';
  return '<div class="tools">'+(extra?b(extra,'Файл','Заменить файл'):'')+
    b('up','&#8593;','Выше')+b('down','&#8595;','Ниже')+b('del','&#10005;','Удалить')+'</div>';
}
const bind = (path,ph2,tag,cls) => '<'+(tag||'span')+(cls?' class="'+cls+'"':'')+
  ' data-bind="'+path+'" data-ph="'+esc(ph2)+'"></'+(tag||'span')+'>';

/* ================================================================ */
/*  ОТРИСОВКА                                                       */
/* ================================================================ */
function renderChrome(){
  document.title = 'Памяти · ' + DATA.short;
  $('#brandName').textContent  = DATA.short;
  $('#brandYears').textContent = DATA.years;
  $('#nav').innerHTML = Object.entries(DATA.labels)
    .map(([id,t]) => '<li><a href="#'+id+'">'+esc(t)+'</a></li>').join('');
  $$('[data-h]').forEach(el => el.textContent = DATA.labels[el.dataset.h]);
  $('#heroDates').textContent = DATA.born + ' — ' + DATA.died;
  $('#portrait').src = pic(DATA.portrait, DATA.short, 900, 1150);
  $('#portrait').alt = DATA.name;
  $('#heroBg').style.setProperty('--cover',
    DATA.cover ? 'url("'+DATA.cover+'")' : 'linear-gradient(150deg,#1e2024,#0a0a0b)');
  document.body.classList.toggle('has-cover', !!DATA.cover);
  $('#fName').textContent  = DATA.name;
  $('#fYears').textContent = DATA.born + ' — ' + DATA.died;
  $('#fContact').innerHTML = [
    DATA.contact.email ? '<a href="mailto:'+esc(DATA.contact.email)+'">'+esc(DATA.contact.email)+'</a>' : '',
    DATA.contact.phone ? esc(DATA.contact.phone) : ''
  ].filter(Boolean).join(' · ');
  $('#mapRow').innerHTML = DATA.farewell.mapUrl
    ? '<a class="micro" href="'+esc(DATA.farewell.mapUrl)+'" target="_blank" rel="noopener">Показать на карте &#8599;</a>' : '';
}

function renderBio(){
  $('#bio').innerHTML = DATA.about.map((p,i) =>
    '<div class="item">'+bind('about.'+i,'текст абзаца','p')+tools('about',i)+'</div>').join('');
  $('#facts').innerHTML = DATA.facts.map((f,i) =>
    '<div class="fact item"><span class="micro">'+bind('facts.'+i+'.k','название')+'</span>'+
    '<b>'+bind('facts.'+i+'.v','значение')+'</b>'+tools('facts',i)+'</div>').join('');
}

function renderTimeline(){
  $('#tl').innerHTML = DATA.timeline.map((t,i) =>
    '<div class="tl-item item"><div class="tl-year">'+bind('timeline.'+i+'.year','год')+'</div>'+
    '<div><div class="tl-title">'+bind('timeline.'+i+'.title','событие')+'</div>'+
    '<div class="tl-text">'+bind('timeline.'+i+'.text','подробности')+'</div></div>'+
    tools('timeline',i)+'</div>').join('');
}

function renderGallery(){
  $('#gal').innerHTML = DATA.gallery.map((g,i) =>
    '<figure class="shot item" data-i="'+i+'">'+
    '<span class="n">'+pad(i+1)+'</span>'+
    '<div class="frame"><img alt="'+esc(g.caption)+'" loading="lazy" src="'+
      pic(g.src, g.year || 'фото', 900, 1120)+'"></div>'+
    '<figcaption><b>'+bind('gallery.'+i+'.caption','подпись')+'</b>'+
    '<span class="micro">'+bind('gallery.'+i+'.year','год')+'</span></figcaption>'+
    '<div class="editonly"><div class="srcrow"><span>Файл:</span>'+
      bind('gallery.'+i+'.src','media/имя.jpg')+'</div></div>'+
    tools('gallery',i,'pic')+'</figure>').join('');
}

function renderVideos(){
  $('#videos').innerHTML = DATA.videos.map((v,i) => {
    let box;
    if (v.youtube) box = '<iframe src="https://www.youtube.com/embed/'+esc(v.youtube)+
      '" allowfullscreen loading="lazy" title="'+esc(v.title)+'"><\/iframe>';
    else if (v.src) box = '<video controls preload="metadata"'+
      (v.poster ? ' poster="'+esc(v.poster)+'"' : '')+' src="'+esc(v.src)+'"><\/video>';
    else box = '<div class="vstub"><div class="play">&#9658;</div>'+
      '<div>Видео пока не добавлено.<br>В режиме редактирования укажите файл или ссылку.</div></div>';
    return '<figure class="vcard item"><div class="vbox">'+box+'</div>'+
      '<figcaption class="vmeta"><h3>'+bind('videos.'+i+'.title','название')+'</h3>'+
      '<p>'+bind('videos.'+i+'.text','описание')+'</p>'+
      '<div class="editonly"><div class="srcrow"><span>Файл:</span>'+
        bind('videos.'+i+'.src','media/video.mp4')+
        '<span>YouTube:</span>'+bind('videos.'+i+'.youtube','ID ролика')+
        '<span>Обложка:</span>'+bind('videos.'+i+'.poster','media/poster.jpg')+
      '</div></div></figcaption>'+tools('videos',i)+'</figure>';
  }).join('');
}

function renderMemories(){
  $('#mem').innerHTML = DATA.memories.map((m,i) =>
    '<figure class="memo item"><p>'+bind('memories.'+i+'.text','текст воспоминания')+'</p>'+
    '<figcaption class="who"><b>'+bind('memories.'+i+'.author','имя')+'</b> '+
    '<span class="micro">'+bind('memories.'+i+'.relation','кем приходится')+'</span></figcaption>'+
    tools('memories',i)+'</figure>').join('');
}

function fillBinds(){
  $$('[data-bind]').forEach(el => {
    const v = getPath(DATA, el.dataset.bind);
    if (el.textContent !== (v ?? '')) el.textContent = v ?? '';
  });
}

function renderAll(){
  renderChrome(); renderBio(); renderTimeline();
  renderGallery(); renderVideos(); renderMemories();
  fillBinds(); applyEditing();
  if (EDITING) revealAll();
}

/* ================================================================ */
/*  ГАЛЕРЕЯ: просмотр во весь экран                                 */
/* ================================================================ */
let idx = 0;
const lb = $('#lb');
function openLb(i){
  if (!DATA.gallery.length) return;
  idx = (i + DATA.gallery.length) % DATA.gallery.length;
  const g = DATA.gallery[idx];
  $('#lbImg').src = pic(g.src, g.year || 'фото', 1500, 1050);
  $('#lbCap').textContent = [g.caption, g.year].filter(Boolean).join(' · ');
  lb.classList.add('on');
}
$('#gal').addEventListener('click', e => {
  if (EDITING) return;
  const f = e.target.closest('.shot'); if (f) openLb(+f.dataset.i);
});
$('.close',lb).onclick = () => lb.classList.remove('on');
$('.prev',lb).onclick  = () => openLb(idx-1);
$('.next',lb).onclick  = () => openLb(idx+1);
lb.addEventListener('click', e => { if (e.target === lb) lb.classList.remove('on'); });
addEventListener('keydown', e => {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape')     lb.classList.remove('on');
  if (e.key === 'ArrowLeft')  openLb(idx-1);
  if (e.key === 'ArrowRight') openLb(idx+1);
});
const strip = $('#gal');
const stepX = () => Math.min(strip.clientWidth*.72, 430);
$('#gPrev').onclick = () => strip.scrollBy({left:-stepX(), behavior:'smooth'});
$('#gNext').onclick = () => strip.scrollBy({left: stepX(), behavior:'smooth'});

/* ================================================================ */
/*  РЕДАКТИРОВАНИЕ                                                  */
/* ================================================================ */
let EDITING = false;

function applyEditing(){
  $$('[data-bind]').forEach(el => {
    if (EDITING) el.setAttribute('contenteditable','true');
    else el.removeAttribute('contenteditable');
  });
}
function setEditing(on){
  EDITING = on;
  document.body.classList.toggle('editing', on);
  $('#edToggle').textContent = on ? 'Готово' : 'Редактировать';
  $('#edToggle').classList.toggle('primary', !on);
  applyEditing();
  if (on){ revealAll(); status(draftLoaded ? 'Черновик в браузере' : 'Правьте текст прямо на странице'); }
  else { renderAll(); status(draftLoaded ? 'Есть несохранённые правки' : ''); }
}
$('#edToggle').onclick = () => setEditing(!EDITING);

/* ввод текста */
document.addEventListener('input', e => {
  const el = e.target.closest('[data-bind]'); if (!el) return;
  setPath(DATA, el.dataset.bind, el.textContent);
  const p = el.dataset.bind;
  if (p === 'name' || p === 'short' || p === 'years') renderChrome();
  saveDraft();
});
/* вставка — только текстом */
document.addEventListener('paste', e => {
  const el = e.target.closest('[data-bind]'); if (!el || !EDITING) return;
  e.preventDefault();
  document.execCommand('insertText', false, (e.clipboardData||window.clipboardData).getData('text'));
});
/* Enter: в биографии — новый абзац, в остальном — выход из поля */
document.addEventListener('keydown', e => {
  const el = e.target.closest('[data-bind]');
  if (el && e.key === 'Enter'){
    e.preventDefault();
    const m = /^about\.(\d+)$/.exec(el.dataset.bind);
    if (m){ DATA.about.splice(+m[1]+1, 0, ''); saveDraft(); renderAll();
      const next = $('[data-bind="about.'+(+m[1]+1)+'"]'); if (next) next.focus(); }
    else el.blur();
  }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'e'){ e.preventDefault(); setEditing(!EDITING); }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 's' && EDITING){ e.preventDefault(); saveFile(); }
});

/* кнопки у элементов списков */
const BLANK = {
  about:    () => '',
  facts:    () => ({ k:'Новый факт', v:'' }),
  timeline: () => ({ year:'', title:'Новое событие', text:'' }),
  gallery:  () => ({ src:'', caption:'Новая фотография', year:'' }),
  videos:   () => ({ src:'', youtube:'', poster:'', title:'Новое видео', text:'' }),
  memories: () => ({ author:'', relation:'', text:'' })
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, list = b.dataset.list, i = +b.dataset.i;
  if (act === 'portrait'){ pickImages(u => { DATA.portrait = u; saveDraft(); renderAll(); }, false, 1400); return; }
  if (act === 'cover'){    pickImages(u => { DATA.cover    = u; saveDraft(); renderAll(); }, false, 2000); return; }
  if (act === 'clearpic'){ DATA.portrait = ''; DATA.cover = ''; saveDraft(); renderAll(); return; }
  if (!list) return;
  const arr = DATA[list];
  if (act === 'del'){ if (!confirm('Удалить этот блок?')) return; arr.splice(i,1); }
  if (act === 'up'   && i > 0)            arr.splice(i-1, 0, arr.splice(i,1)[0]);
  if (act === 'down' && i < arr.length-1) arr.splice(i+1, 0, arr.splice(i,1)[0]);
  if (act === 'pic'){ pickImages(u => { arr[i].src = u; saveDraft(); renderAll(); }, false, 1800); return; }
  saveDraft(); renderAll();
});
/* кнопки «добавить» */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-add]'); if (!b) return;
  const list = b.dataset.add;
  if (list === 'gallery'){
    pickImages(u => { DATA.gallery.push({ src:u, caption:'', year:'' }); saveDraft(); renderAll(); }, true, 1800);
    return;
  }
  DATA[list].push(BLANK[list]());
  saveDraft(); renderAll();
  const last = $$('[data-bind^="'+list+'."]').pop(); if (last) last.focus();
});

/* выбор картинок + уменьшение до разумного размера */
function pickImages(cb, multiple, max){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = !!multiple;
  inp.onchange = () => { [...inp.files].forEach(f => shrink(f, max||1800, cb)); };
  inp.click();
}
function shrink(file, max, cb){
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      let w = im.naturalWidth, h = im.naturalHeight;
      const k = Math.min(1, max / Math.max(w,h));
      w = Math.round(w*k); h = Math.round(h*k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(im, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', .82));
    };
    im.onerror = () => alert('Не удалось прочитать файл: ' + file.name);
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}
/* перетаскивание файлов в галерею */
const drop = $('#gallery');
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => {
  if (!EDITING) return; e.preventDefault(); drop.classList.add('drop');
}));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove('drop')));
drop.addEventListener('drop', e => {
  if (!EDITING) return;
  e.preventDefault();
  const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
  files.forEach(f => shrink(f, 1800, u => {
    DATA.gallery.push({ src:u, caption:'', year:'' }); saveDraft(); renderAll();
  }));
});

/* ---------- сохранение готового index.html ---------- */
const q = s => JSON.stringify(String(s ?? '')).replace(/<\//g, '<\\/');
function serialize(d){
  const L = [];
  const obj = (o, keys) => '{ ' + keys.map(k => k + ': ' + q(o[k])).join(', ') + ' }';
  const list = (arr, fn) => arr.map((x,i) => '    ' + fn(x) + (i < arr.length-1 ? ',' : '')).join('\n');
  L.push('const DATA = {');
  L.push('');
  L.push('  /* --- Шапка и обложка --- */');
  ['name','short','years','born','died','role','place','epitaph'].forEach(k =>
    L.push('  ' + (k+':').padEnd(10) + q(d[k]) + ','));
  L.push('');
  L.push('  portrait: ' + q(d.portrait) + ',');
  L.push('  cover:    ' + q(d.cover) + ',');
  L.push('');
  L.push('  /* --- Биография: каждый абзац — отдельная строка в кавычках --- */');
  L.push('  about: ['); L.push(list(d.about, p => q(p))); L.push('  ],');
  L.push('');
  L.push('  /* --- Короткие факты в колонке справа --- */');
  L.push('  facts: ['); L.push(list(d.facts, f => obj(f,['k','v']))); L.push('  ],');
  L.push('');
  L.push('  /* --- Хронология жизни --- */');
  L.push('  timeline: ['); L.push(list(d.timeline, t => obj(t,['year','title','text']))); L.push('  ],');
  L.push('');
  L.push('  /* --- Фотогалерея. Добавляйте строки по образцу --- */');
  L.push('  gallery: ['); L.push(list(d.gallery, g => obj(g,['src','caption','year']))); L.push('  ],');
  L.push('');
  L.push('  /* --- Видео. Либо src (свой файл), либо youtube (ID ролика) --- */');
  L.push('  videos: ['); L.push(list(d.videos, v => obj(v,['src','youtube','poster','title','text']))); L.push('  ],');
  L.push('');
  L.push('  /* --- Воспоминания близких --- */');
  L.push('  memories: ['); L.push(list(d.memories, m => obj(m,['author','relation','text']))); L.push('  ],');
  L.push('');
  L.push('  /* --- Прощание и место памяти --- */');
  L.push('  farewell: {');
  L.push('    text:   ' + q(d.farewell.text) + ',');
  L.push('    date:   ' + q(d.farewell.date) + ',');
  L.push('    place:  ' + q(d.farewell.place) + ',');
  L.push('    mapUrl: ' + q(d.farewell.mapUrl));
  L.push('  },');
  L.push('');
  L.push('  /* --- Контакты семьи (можно оставить пустыми) --- */');
  L.push('  contact: { email: ' + q(d.contact.email) + ', phone: ' + q(d.contact.phone) + ' },');
  L.push('');
  L.push('  /* --- Подписи разделов --- */');
  L.push('  labels: {');
  L.push('    ' + Object.entries(d.labels).map(([k,v]) => k + ': ' + q(v)).join(', '));
  L.push('  }');
  L.push('};');
  return L.join('\n');
}
function saveFile(){
  const open  = TEMPLATE.indexOf('<script id="data">');
  const close = TEMPLATE.indexOf('<\/script>', open);
  if (open < 0 || close < 0){ alert('Не удалось собрать файл: не найден блок данных.'); return; }
  let out = TEMPLATE.slice(0, open) + '<script id="data">\n' + serialize(DATA) + '\n' + TEMPLATE.slice(close);
  out = out.replace(/<body data-theme="[^"]*"/, '<body data-theme="' + document.body.dataset.theme + '"');
  out = out.replace(/<title>[\s\S]*?<\/title>/, '<title>Памяти · ' + esc(DATA.short) + '</title>');
  const blob = new Blob([out], { type:'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'index.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  const mb = (blob.size/1048576).toFixed(1);
  status('Файл сохранён (' + mb + ' МБ)');
}
$('#edSave').onclick = saveFile;
$('#edReset').onclick = () => {
  if (!confirm('Отменить все правки и вернуться к тому, что записано в файле?')) return;
  localStorage.removeItem(KEY); location.reload();
};

/* ================================================================ */
/*  ТЕМЫ, ПОЯВЛЕНИЕ, МЕНЮ                                           */
/* ================================================================ */
const TKEY = 'pamyat-theme:' + location.pathname;
function setTheme(t){
  document.body.dataset.theme = t;
  try{ localStorage.setItem(TKEY, t); }catch(e){}
  $$('#themes button').forEach(b => b.classList.toggle('on', b.dataset.theme === t));
  renderChrome(); renderGallery(); fillBinds(); applyEditing();
}
const themebar = $('#themes');
if (themebar){
  $$('#themes button').forEach(b => b.onclick = () => setTheme(b.dataset.theme));
}

const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add('in')),
  { threshold:.06, rootMargin:'0px 0px -8% 0px' });
function revealAll(){ $$('.rv').forEach(el => el.classList.add('in')); }
$$('.rv').forEach(el => io.observe(el));

const spy = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  $$('#nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#'+e.target.id));
}), { rootMargin:'-25% 0px -68% 0px' });
$$('section.block').forEach(s => spy.observe(s));

/* ---------- запуск ---------- */
renderAll();
setTheme(DEFAULT_THEME);
if (draftLoaded) status('Загружен черновик из браузера');
</script>
</body>
</html>
